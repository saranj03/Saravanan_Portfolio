        </div>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="py-12 px-6 text-center bg-slate-900 text-white">
    <div class="text-3xl font-bold mb-3 font-pop">SJ</div>
    <p class="opacity-80 mb-2">Building reliable systems that power banking worldwide</p>
    <p class="text-sm opacity-60">© 2026 Saravanan J. Crafted with ❤️ in Chennai.</p>
  </footer>

  <script>
    // Theme toggle (remembers choice)
    const root = document.documentElement;
    const saved = localStorage.getItem('theme');
    if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      root.classList.add('dark');
    }
    document.getElementById('theme-toggle').addEventListener('click', () => {
      root.classList.toggle('dark');
      localStorage.setItem('theme', root.classList.contains('dark') ? 'dark' : 'light');
    });

    // Scroll-in animations
    gsap.registerPlugin(ScrollTrigger);
    gsap.utils.toArray('.section-enter').forEach((el) => {
      gsap.to(el, {
        opacity: 1, y: 0, duration: 0.9, ease: 'power3.out',
        scrollTrigger: { trigger: el, start: 'top 85%' }
      });
    });
  </script>
</body>
</html>
